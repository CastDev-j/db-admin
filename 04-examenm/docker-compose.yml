services:
  sqlserver-torneo:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-torneo
    hostname: sqlserver-torneo
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Password123"
      MSSQL_PID: "Developer"
    ports:
      - "0.0.0.0:1435:1433"
    volumes:
      - sqlserver_torneo_data:/var/opt/mssql
    restart: unless-stopped

volumes:
  sqlserver_torneo_data:
